<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0eff5;
            --surface: #ffffff;
            --surface2: #f7f6fb;
            --border: #e4e2ed;
            --text: #1c1b2e;
            --text2: #6b6a80;
            --text3: #a3a3b8;
            --accent: #6c5ce7;
            --accent2: #a29bfe;
            --accent-rgb: 108, 92, 231;
            --amber: #e9a825;
            --red: #e05454;
            --green: #22a06b;
            --blue: #2980b9;
            --cyan: #0891b2;
            --shadow: 0 2px 8px rgba(108,92,231,0.07);
            --shadow-lg: 0 8px 32px rgba(108,92,231,0.13);
            --radius: 14px;
            --radius-sm: 9px;
        }

        [data-theme="dark"] {
            --bg: #11101e;
            --surface: #1a1829;
            --surface2: #201e33;
            --border: #2e2b48;
            --text: #e8e7f5;
            --text2: #9896b0;
            --text3: #5e5c7a;
            --shadow: 0 2px 8px rgba(0,0,0,0.35);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* ─── Header ─────────────────────────────────── */
        .header {
            background: var(--surface);
            border-bottom: 1.5px solid var(--border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.5em;
            color: var(--accent);
            letter-spacing: -0.5px;
        }

        .header .date-time {
            font-size: 0.78em;
            color: var(--text3);
            margin-top: 1px;
        }

        .dark-toggle {
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 7px 16px;
            cursor: pointer;
            font-size: 0.82em;
            font-weight: 600;
            color: var(--text2);
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s;
        }

        .dark-toggle:hover { border-color: var(--accent); color: var(--accent); }

        /* ─── Progress Banner ─────────────────────────── */
        .progress-wrap {
            background: var(--surface);
            padding: 16px 28px;
            border-bottom: 1px solid var(--border);
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .progress-label { font-size: 0.78em; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; }

        .progress-pct {
            font-family: 'Syne', sans-serif;
            font-size: 1.35em;
            font-weight: 800;
            color: var(--accent);
        }

        .progress-track {
            height: 7px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 4px;
            transition: width 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ─── Layout ──────────────────────────────────── */
        .main {
            max-width: 1240px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 310px 1fr;
            gap: 22px;
        }

        @media (max-width: 900px) {
            .main { grid-template-columns: 1fr; }
        }

        .sidebar { display: flex; flex-direction: column; gap: 16px; }
        .content { display: flex; flex-direction: column; gap: 14px; }

        /* ─── Card ────────────────────────────────────── */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1.5px solid var(--border);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-family: 'Syne', sans-serif;
            font-size: 0.88em;
            font-weight: 800;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 16px;
        }

        /* ─── Form ────────────────────────────────────── */
        .form-group { margin-bottom: 11px; }

        label {
            display: block;
            font-size: 0.74em;
            font-weight: 700;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="date"], input[type="time"],
        input[type="file"], select, textarea {
            width: 100%;
            padding: 8px 11px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.88em;
            font-family: 'Outfit', sans-serif;
            background: var(--surface2);
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.1);
        }

        textarea { resize: vertical; min-height: 62px; }

        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* ─── Tags Input ─────────────────────────────── */
        .tags-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding: 7px 9px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface2);
            min-height: 40px;
            cursor: text;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .tags-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.1);
        }

        .tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 0.73em;
            font-weight: 600;
            background: rgba(var(--accent-rgb), 0.12);
            color: var(--accent);
            cursor: default;
            user-select: none;
        }

        .tag-chip.rm .x { cursor: pointer; opacity: 0.55; font-size: 0.85em; }
        .tag-chip.rm .x:hover { opacity: 1; }

        .tag-text-input {
            border: none !important;
            background: transparent !important;
            padding: 2px 4px !important;
            min-width: 80px;
            flex: 1;
            font-size: 0.84em;
            box-shadow: none !important;
        }

        .tag-suggestions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }

        .tag-sug {
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 0.72em;
            font-weight: 600;
            border: 1.5px dashed var(--border);
            color: var(--text3);
            cursor: pointer;
            background: none;
            font-family: 'Outfit', sans-serif;
            transition: all 0.15s;
        }

        .tag-sug:hover { border-color: var(--accent); color: var(--accent); }

        /* ─── Buttons ─────────────────────────────────── */
        .btn {
            padding: 9px 17px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.87em;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            width: 100%;
            justify-content: center;
            padding: 11px;
        }

        .btn-primary:hover {
            background: #5a4fd1;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(var(--accent-rgb), 0.3);
        }

        .btn-ghost {
            background: var(--surface2);
            color: var(--text2);
            border: 1.5px solid var(--border);
        }

        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

        /* ─── Stats ───────────────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-item {
            text-align: center;
            padding: 11px 6px;
            background: var(--surface2);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .stat-number {
            font-family: 'Syne', sans-serif;
            font-size: 1.55em;
            font-weight: 800;
            color: var(--accent);
        }

        .stat-label { font-size: 0.7em; color: var(--text3); margin-top: 1px; text-transform: uppercase; letter-spacing: 0.3px; }

        /* ─── Toolbar ─────────────────────────────────── */
        .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .search-wrap { flex: 1; position: relative; }
        .search-wrap input { padding-left: 34px; }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; font-size: 0.9em; }

        /* ─── Filter pills ────────────────────────────── */
        .filter-pills { display: flex; gap: 7px; flex-wrap: wrap; }

        .fp {
            padding: 5px 14px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text2);
            font-size: 0.8em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Outfit', sans-serif;
        }

        .fp:hover { border-color: var(--accent); color: var(--accent); }
        .fp.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .tag-filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .tag-filter-label { font-size: 0.72em; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
        .tag-filter-chip { cursor: pointer; transition: all 0.15s; }
        .tag-filter-chip.active { background: var(--accent) !important; color: #fff !important; }

        /* ─── Task Card ───────────────────────────────── */
        .task-card {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1.5px solid var(--border);
            border-left: 4px solid var(--accent);
            padding: 13px 15px;
            transition: all 0.2s;
            position: relative;
            box-shadow: var(--shadow);
            animation: fadeUp 0.22s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .task-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }

        .task-card.dragging { opacity: 0.35; cursor: grabbing; }
        .task-card.drag-over { border-top: 3px solid var(--accent); }
        .task-card.completed { opacity: 0.6; }
        .task-card.completed .task-title { text-decoration: line-through; color: var(--text3); }

        .priority-critical { border-left-color: var(--red) !important; }
        .priority-high     { border-left-color: var(--amber) !important; }
        .priority-medium   { border-left-color: #3d9bdc !important; }
        .priority-low      { border-left-color: var(--green) !important; }

        .task-row { display: flex; align-items: flex-start; gap: 11px; }

        .drag-handle {
            color: var(--text3);
            cursor: grab;
            font-size: 1em;
            padding-top: 1px;
            flex-shrink: 0;
            user-select: none;
            line-height: 1;
        }

        .task-cb { width: 17px; height: 17px; margin-top: 2px; cursor: pointer; accent-color: var(--accent); flex-shrink: 0; }

        .task-body { flex: 1; min-width: 0; }

        .task-title { font-weight: 600; font-size: 0.95em; color: var(--text); margin-bottom: 5px; line-height: 1.35; }

        .task-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }

        .badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: 600;
        }

        .b-critical { background: #fef0f0; color: #c94040; }
        .b-high     { background: #fdf6e3; color: #b87a00; }
        .b-medium   { background: #e8f4fd; color: #2471a3; }
        .b-low      { background: #eafaf1; color: #1e8449; }
        .b-cat      { background: rgba(var(--accent-rgb),0.1); color: var(--accent); }
        .b-recur    { background: #e0f7fa; color: var(--cyan); }
        .b-overdue  { background: #fef0f0; color: var(--red); }

        .task-meta { font-size: 0.76em; color: var(--text3); display: flex; gap: 10px; flex-wrap: wrap; }

        .task-actions { display: flex; gap: 5px; flex-shrink: 0; }

        .btn-icon {
            width: 29px; height: 29px;
            border-radius: 7px;
            border: 1.5px solid var(--border);
            background: var(--surface2);
            color: var(--text2);
            cursor: pointer;
            font-size: 0.82em;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            font-family: 'Outfit', sans-serif;
        }

        .btn-icon:hover { border-color: var(--accent); color: var(--accent); background: rgba(var(--accent-rgb), 0.07); }
        .btn-icon.del:hover { border-color: var(--red); color: var(--red); background: #fff0f0; }

        /* ─── Subtask mini progress ───────────────────── */
        .sub-progress { margin-top: 9px; }
        .sub-progress-label { font-size: 0.73em; color: var(--text3); margin-bottom: 3px; }
        .sub-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .sub-fill  { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.3s; }

        /* ─── Subtasks Panel ──────────────────────────── */
        .subtasks-panel {
            display: none;
            margin-top: 11px;
            padding-top: 11px;
            border-top: 1px dashed var(--border);
        }

        .sub-input-row { display: flex; gap: 7px; margin-bottom: 8px; }
        .sub-input-row input { flex: 1; padding: 6px 10px; font-size: 0.83em; }

        .sub-add-btn {
            padding: 6px 12px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .sub-add-btn:hover { background: #5a4fd1; }

        .sub-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
        }

        .sub-item:last-child { border-bottom: none; }

        .sub-item input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
        .sub-text { flex: 1; font-size: 0.83em; color: var(--text); }
        .sub-text.done { text-decoration: line-through; color: var(--text3); }

        .sub-del {
            font-size: 0.72em; color: var(--text3); cursor: pointer;
            padding: 2px 5px; border-radius: 4px;
            background: none; border: none; font-family: 'Outfit', sans-serif;
            transition: color 0.15s;
        }

        .sub-del:hover { color: var(--red); }

        /* ─── Modal ───────────────────────────────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.48);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 620px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            border: 1.5px solid var(--border);
            animation: modalPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-hd {
            padding: 18px 22px 15px;
            border-bottom: 1.5px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-hd h2 { font-family: 'Syne', sans-serif; font-size: 1.1em; color: var(--text); }

        .modal-x {
            width: 30px; height: 30px; border-radius: 50%;
            border: 1.5px solid var(--border); background: var(--surface2);
            color: var(--text2); cursor: pointer; font-size: 1em;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; font-family: 'Outfit', sans-serif;
        }

        .modal-x:hover { border-color: var(--red); color: var(--red); }

        .modal-body { padding: 20px 22px; }

        .modal-ft {
            padding: 14px 22px;
            border-top: 1.5px solid var(--border);
            display: flex;
            gap: 9px;
            justify-content: flex-end;
        }

        .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
        .edit-grid .fw { grid-column: 1 / -1; }

        /* ─── Empty state ─────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text3);
        }

        .empty-icon { font-size: 2.8em; margin-bottom: 12px; opacity: 0.4; }

        .empty-state h3 {
            font-family: 'Syne', sans-serif;
            font-size: 1.05em;
            color: var(--text2);
            margin-bottom: 6px;
        }

        .empty-state p { font-size: 0.82em; }

        /* ─── Scrollbar ───────────────────────────────── */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* ─── Recurring badge flash ───────────────────── */
        @keyframes spawnPulse {
            0%   { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.5); }
            70%  { box-shadow: 0 0 0 10px rgba(var(--accent-rgb), 0); }
            100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0); }
        }

        .task-card.spawned { animation: fadeUp 0.3s ease, spawnPulse 0.8s 0.3s ease; }
    </style>
</head>
<body>

<!-- ═══════════════ HEADER ═══════════════ -->
<div class="header">
    <div>
        <h1>📋 Task Manager</h1>
        <div class="date-time" id="dateTime"></div>
    </div>
    <button class="dark-toggle" id="darkToggle" onclick="app.toggleDark()">🌙 Dark Mode</button>
</div>

<!-- ═══════════════ PROGRESS BAR ═══════════════ -->
<div class="progress-wrap">
    <div class="progress-meta">
        <span class="progress-label">Overall Completion</span>
        <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
</div>

<!-- ═══════════════ MAIN ═══════════════ -->
<div class="main">

    <!-- ── SIDEBAR ── -->
    <div class="sidebar">

        <!-- Add Task Form -->
        <div class="card">
            <div class="card-title" id="formTitle">+ New Task</div>

            <div class="form-group">
                <label>Title *</label>
                <input type="text" id="fTitle" placeholder="What needs to be done?">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="fDesc" placeholder="Optional details..."></textarea>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="fCat">
                    <option>Professional</option><option>Social</option><option>Family</option>
                    <option>Personal Project</option><option>Health</option><option>Education</option>
                    <option>Finance</option><option>Shopping</option><option>Travel</option><option>Entertainment</option>
                </select>
            </div>

            <div class="form-group">
                <label>Priority</label>
                <select id="fPri">
                    <option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option>
                </select>
            </div>

            <div class="form-group grid2">
                <div>
                    <label>Due Date</label>
                    <input type="date" id="fDate">
                </div>
                <div>
                    <label>Due Time</label>
                    <input type="time" id="fTime">
                </div>
            </div>

            <div class="form-group">
                <label>Recurring</label>
                <select id="fRecur">
                    <option value="none">None</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="biweekly">Every 2 Weeks</option>
                    <option value="monthly">Monthly</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tags</label>
                <div class="tags-wrap" id="tagsWrap" onclick="document.getElementById('tagInput').focus()">
                    <input class="tag-text-input" id="tagInput" placeholder="Type + Enter to add...">
                </div>
                <div class="tag-suggestions" id="tagSugs"></div>
            </div>

            <div class="form-group">
                <label>Attach File</label>
                <input type="file" id="fFile" accept=".docx,.pdf,.jpeg,.jpg,.png,.txt,.json,.csv,.xlsx,.pptx,.doc,.xls,.gif,.bmp,.zip,.rar">
            </div>

            <div style="display:flex;gap:8px;margin-top:4px;">
                <button class="btn btn-primary" id="submitBtn" onclick="app.submit()">Add Task</button>
                <button class="btn btn-ghost" id="cancelBtn" style="display:none;width:auto;" onclick="app.cancelEdit()">Cancel</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="card">
            <div class="card-title">Overview</div>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-number" id="sTotal">0</div><div class="stat-label">Total</div></div>
                <div class="stat-item"><div class="stat-number" id="sActive">0</div><div class="stat-label">Active</div></div>
                <div class="stat-item"><div class="stat-number" id="sDone">0</div><div class="stat-label">Done</div></div>
                <div class="stat-item"><div class="stat-number" id="sCrit">0</div><div class="stat-label">Critical</div></div>
                <div class="stat-item"><div class="stat-number" id="sOver">0</div><div class="stat-label">Overdue</div></div>
                <div class="stat-item"><div class="stat-number" id="sRecur">0</div><div class="stat-label">Recurring</div></div>
            </div>
            <button class="btn btn-ghost" style="width:100%;margin-top:13px;color:var(--red);border-color:#ffd6d6;" onclick="app.clearAll()">🗑 Clear All Tasks</button>
        </div>
    </div>

    <!-- ── CONTENT ── -->
    <div class="content">

        <!-- Search -->
        <div class="toolbar">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search by title, tag, category..." oninput="app.render()">
            </div>
        </div>

        <!-- Filters -->
        <div class="filter-pills">
            <button class="fp active" onclick="app.setFilter('all',this)">All</button>
            <button class="fp" onclick="app.setFilter('active',this)">Active</button>
            <button class="fp" onclick="app.setFilter('completed',this)">Completed</button>
            <button class="fp" onclick="app.setFilter('critical',this)">🔴 Critical</button>
            <button class="fp" onclick="app.setFilter('overdue',this)">⏰ Overdue</button>
            <button class="fp" onclick="app.setFilter('recurring',this)">🔄 Recurring</button>
        </div>

        <!-- Tag filters -->
        <div class="tag-filters" id="tagFilters"></div>

        <!-- Task list -->
        <div id="taskList"></div>

        <div class="empty-state" id="emptyState" style="display:none;">
            <div class="empty-icon">📭</div>
            <h3>No tasks found</h3>
            <p>Add a new task or adjust your filters.</p>
        </div>
    </div>
</div>

<!-- ═══════════════ EDIT MODAL ═══════════════ -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <div class="modal-hd">
            <h2>✏️ Edit Task</h2>
            <button class="modal-x" onclick="app.closeModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="edit-grid">
                <div class="fw form-group">
                    <label>Title *</label>
                    <input type="text" id="eTitle">
                </div>
                <div class="fw form-group">
                    <label>Description</label>
                    <textarea id="eDesc"></textarea>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="eCat">
                        <option>Professional</option><option>Social</option><option>Family</option>
                        <option>Personal Project</option><option>Health</option><option>Education</option>
                        <option>Finance</option><option>Shopping</option><option>Travel</option><option>Entertainment</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <select id="ePri">
                        <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="eDate">
                </div>
                <div class="form-group">
                    <label>Due Time</label>
                    <input type="time" id="eTime">
                </div>
                <div class="form-group">
                    <label>Recurring</label>
                    <select id="eRecur">
                        <option value="none">None</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="biweekly">Every 2 Weeks</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tags (comma-separated)</label>
                    <input type="text" id="eTags" placeholder="work, urgent, design...">
                </div>
            </div>
        </div>
        <div class="modal-ft">
            <button class="btn btn-ghost" onclick="app.closeModal()">Cancel</button>
            <button class="btn btn-primary" style="width:auto;" onclick="app.saveEdit()">Save Changes</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
class TaskApp {
    constructor() {
        this.tasks    = this.load('tm_tasks') || [];
        this.filter   = 'all';
        this.activeTag = null;
        this.editId   = null;
        this.formTags = [];
        this.dragSrcId = null;
        this.darkMode  = this.load('tm_dark') || false;
        this.init();
    }

    /* ─── INIT ─── */
    init() {
        if (this.darkMode) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('darkToggle').textContent = '☀️ Light Mode';
        }

        setInterval(() => this.updateClock(), 1000);
        this.updateClock();

        const tagInput = document.getElementById('tagInput');
        tagInput.addEventListener('keydown', e => {
            if ((e.key === 'Enter' || e.key === ',') && tagInput.value.trim()) {
                e.preventDefault();
                this.addFormTag(tagInput.value.trim().replace(',',''));
                tagInput.value = '';
            } else if (e.key === 'Backspace' && !tagInput.value && this.formTags.length) {
                this.formTags.pop();
                this.renderFormTags();
            }
        });

        this.renderTagSugs();
        this.render();
    }

    updateClock() {
        document.getElementById('dateTime').textContent = new Date().toLocaleString('en-US', {
            weekday:'short', year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'
        });
    }

    toggleDark() {
        this.darkMode = !this.darkMode;
        document.documentElement.setAttribute('data-theme', this.darkMode ? 'dark' : 'light');
        document.getElementById('darkToggle').textContent = this.darkMode ? '☀️ Light Mode' : '🌙 Dark Mode';
        this.save('tm_dark', this.darkMode);
    }

    /* ─── TAG INPUT ─── */
    addFormTag(tag) {
        tag = tag.trim().toLowerCase().replace(/[^a-z0-9\-_]/g,'');
        if (!tag || this.formTags.includes(tag)) return;
        this.formTags.push(tag);
        this.renderFormTags();
        this.renderTagSugs();
    }

    renderFormTags() {
        const wrap = document.getElementById('tagsWrap');
        wrap.querySelectorAll('.tag-chip').forEach(el => el.remove());
        const input = document.getElementById('tagInput');
        this.formTags.forEach((tag, i) => {
            const chip = document.createElement('span');
            chip.className = 'tag-chip rm';
            chip.innerHTML = `${tag} <span class="x" onclick="app.removeFormTag(${i})">✕</span>`;
            wrap.insertBefore(chip, input);
        });
    }

    removeFormTag(i) {
        this.formTags.splice(i, 1);
        this.renderFormTags();
    }

    renderTagSugs() {
        const allTags = [...new Set(this.tasks.flatMap(t => t.tags || []))].filter(t => !this.formTags.includes(t)).slice(0, 8);
        document.getElementById('tagSugs').innerHTML = allTags.map(tag =>
            `<button class="tag-sug" onclick="app.addFormTag('${tag}')">${tag}</button>`
        ).join('');
    }

    /* ─── ADD TASK ─── */
    submit() {
        const title = document.getElementById('fTitle').value.trim();
        if (!title) { alert('Please enter a task title.'); return; }

        const data = {
            id: Date.now(),
            title,
            description: document.getElementById('fDesc').value.trim(),
            category: document.getElementById('fCat').value,
            priority: document.getElementById('fPri').value,
            dueDate: document.getElementById('fDate').value,
            dueTime: document.getElementById('fTime').value,
            recurring: document.getElementById('fRecur').value,
            tags: [...this.formTags],
            completed: false,
            createdAt: new Date().toLocaleString(),
            subtasks: [],
            attachments: []
        };

        const file = document.getElementById('fFile').files[0];
        const proceed = d => {
            this.tasks.unshift(d);
            this.saveAll();
            this.resetForm();
            this.render();
        };

        if (file) {
            const r = new FileReader();
            r.onload = e => {
                data.attachments.push({ name: file.name, type: file.type, size: file.size, data: e.target.result });
                proceed(data);
            };
            r.readAsDataURL(file);
        } else {
            proceed(data);
        }
    }

    resetForm() {
        ['fTitle','fDesc','fDate','fTime'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('fCat').value = 'Professional';
        document.getElementById('fPri').value = 'Medium';
        document.getElementById('fRecur').value = 'none';
        document.getElementById('fFile').value = '';
        this.formTags = [];
        this.renderFormTags();
        this.renderTagSugs();
    }

    cancelEdit() {
        this.editId = null;
        document.getElementById('formTitle').textContent = '+ New Task';
        document.getElementById('submitBtn').textContent = 'Add Task';
        document.getElementById('cancelBtn').style.display = 'none';
        this.resetForm();
    }

    /* ─── DELETE / TOGGLE ─── */
    deleteTask(id) {
        if (!confirm('Delete this task?')) return;
        this.tasks = this.tasks.filter(t => t.id !== id);
        this.saveAll(); this.render();
    }

    toggleTask(id) {
        const task = this.tasks.find(t => t.id === id);
        if (!task) return;
        task.completed = !task.completed;

        if (task.completed && task.recurring !== 'none') {
            this.spawnRecurring(task);
        }

        this.saveAll(); this.render();
    }

    spawnRecurring(task) {
        if (!task.dueDate) return;
        const next = new Date(task.dueDate + 'T00:00:00');
        const days = { daily:1, weekly:7, biweekly:14, monthly:30 };
        next.setDate(next.getDate() + (days[task.recurring] || 7));

        const newTask = {
            ...task,
            id: Date.now() + 1,
            completed: false,
            dueDate: next.toISOString().split('T')[0],
            createdAt: new Date().toLocaleString(),
            subtasks: (task.subtasks || []).map(s => ({ ...s, done: false })),
            _spawned: true
        };

        this.tasks.unshift(newTask);
    }

    /* ─── EDIT MODAL ─── */
    openEdit(id) {
        const t = this.tasks.find(x => x.id === id);
        if (!t) return;
        this.editId = id;

        document.getElementById('eTitle').value   = t.title;
        document.getElementById('eDesc').value    = t.description || '';
        document.getElementById('eCat').value     = t.category;
        document.getElementById('ePri').value     = t.priority;
        document.getElementById('eDate').value    = t.dueDate || '';
        document.getElementById('eTime').value    = t.dueTime || '';
        document.getElementById('eRecur').value   = t.recurring || 'none';
        document.getElementById('eTags').value    = (t.tags || []).join(', ');

        document.getElementById('editModal').classList.add('open');
    }

    closeModal() {
        document.getElementById('editModal').classList.remove('open');
        this.editId = null;
    }

    saveEdit() {
        const t = this.tasks.find(x => x.id === this.editId);
        if (!t) return;
        const title = document.getElementById('eTitle').value.trim();
        if (!title) { alert('Title is required.'); return; }

        t.title       = title;
        t.description = document.getElementById('eDesc').value.trim();
        t.category    = document.getElementById('eCat').value;
        t.priority    = document.getElementById('ePri').value;
        t.dueDate     = document.getElementById('eDate').value;
        t.dueTime     = document.getElementById('eTime').value;
        t.recurring   = document.getElementById('eRecur').value;
        t.tags        = document.getElementById('eTags').value
            .split(',').map(x => x.trim().toLowerCase()).filter(Boolean);

        this.saveAll();
        this.closeModal();
        this.render();
    }

    /* ─── SUBTASKS ─── */
    addSubtask(taskId) {
        const input = document.getElementById(`si-${taskId}`);
        const text = input ? input.value.trim() : '';
        if (!text) return;
        const task = this.tasks.find(t => t.id === taskId);
        if (!task) return;
        task.subtasks = task.subtasks || [];
        task.subtasks.push({ id: Date.now(), text, done: false });
        input.value = '';
        this.saveAll(); this.render();
        // re-open panel
        setTimeout(() => {
            const panel = document.getElementById(`sp-${taskId}`);
            if (panel) panel.style.display = 'block';
        }, 10);
    }

    toggleSubtask(taskId, subId) {
        const task = this.tasks.find(t => t.id === taskId);
        if (!task) return;
        const sub = task.subtasks.find(s => s.id === subId);
        if (sub) sub.done = !sub.done;
        this.saveAll(); this.render();
        setTimeout(() => {
            const panel = document.getElementById(`sp-${taskId}`);
            if (panel) panel.style.display = 'block';
        }, 10);
    }

    deleteSubtask(taskId, subId) {
        const task = this.tasks.find(t => t.id === taskId);
        if (!task) return;
        task.subtasks = task.subtasks.filter(s => s.id !== subId);
        this.saveAll(); this.render();
        setTimeout(() => {
            const panel = document.getElementById(`sp-${taskId}`);
            if (panel) panel.style.display = 'block';
        }, 10);
    }

    togglePanel(taskId, btn) {
        const panel = document.getElementById(`sp-${taskId}`);
        if (!panel) return;
        const showing = panel.style.display === 'block';
        panel.style.display = showing ? 'none' : 'block';
        btn.style.background = showing ? '' : 'var(--accent)';
        btn.style.color      = showing ? '' : '#fff';
        btn.style.borderColor= showing ? '' : 'var(--accent)';
    }

    /* ─── FILTER ─── */
    setFilter(f, el) {
        this.filter = f;
        this.activeTag = null;
        document.querySelectorAll('.fp').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        this.render();
    }

    setTagFilter(tag) {
        this.activeTag = this.activeTag === tag ? null : tag;
        this.render();
    }

    isOverdue(task) {
        if (!task.dueDate || task.completed) return false;
        const today = new Date(); today.setHours(0,0,0,0);
        const due = new Date(task.dueDate + 'T00:00:00');
        return due < today;
    }

    getFiltered() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        let list = [...this.tasks];

        if (q) list = list.filter(t =>
            t.title.toLowerCase().includes(q) ||
            (t.description || '').toLowerCase().includes(q) ||
            t.category.toLowerCase().includes(q) ||
            (t.tags || []).some(tag => tag.includes(q))
        );

        if (this.activeTag) list = list.filter(t => (t.tags || []).includes(this.activeTag));

        switch (this.filter) {
            case 'active':    return list.filter(t => !t.completed);
            case 'completed': return list.filter(t => t.completed);
            case 'critical':  return list.filter(t => t.priority === 'Critical');
            case 'overdue':   return list.filter(t => this.isOverdue(t));
            case 'recurring': return list.filter(t => t.recurring && t.recurring !== 'none');
            default:          return list;
        }
    }

    /* ─── RENDER ─── */
    updateStats() {
        const all  = this.tasks;
        const done = all.filter(t => t.completed).length;
        const pct  = all.length ? Math.round((done / all.length) * 100) : 0;

        document.getElementById('sTotal').textContent = all.length;
        document.getElementById('sActive').textContent = all.filter(t => !t.completed).length;
        document.getElementById('sDone').textContent   = done;
        document.getElementById('sCrit').textContent   = all.filter(t => t.priority === 'Critical').length;
        document.getElementById('sOver').textContent   = all.filter(t => this.isOverdue(t)).length;
        document.getElementById('sRecur').textContent  = all.filter(t => t.recurring && t.recurring !== 'none').length;

        document.getElementById('progressPct').textContent  = `${pct}%`;
        document.getElementById('progressFill').style.width = `${pct}%`;
    }

    renderTagFilters() {
        const allTags = [...new Set(this.tasks.flatMap(t => t.tags || []))];
        const container = document.getElementById('tagFilters');
        if (!allTags.length) { container.innerHTML = ''; return; }
        container.innerHTML =
            `<span class="tag-filter-label">Tags:</span>` +
            allTags.map(tag =>
                `<span class="tag-chip tag-filter-chip ${this.activeTag === tag ? 'active' : ''}"
                    onclick="app.setTagFilter('${tag}')">${tag}</span>`
            ).join('');
    }

    render() {
        const list     = document.getElementById('taskList');
        const filtered = this.getFiltered();
        list.innerHTML = '';
        document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';

        const recurLabel = { daily:'Daily', weekly:'Weekly', biweekly:'Biweekly', monthly:'Monthly' };

        filtered.forEach(task => {
            const subs    = task.subtasks || [];
            const subDone = subs.filter(s => s.done).length;
            const subPct  = subs.length ? Math.round((subDone / subs.length) * 100) : null;
            const overdue = this.isOverdue(task);
            const dueStr  = task.dueDate
                ? new Date(task.dueDate + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })
                : null;

            const card = document.createElement('div');
            card.className = `task-card priority-${task.priority.toLowerCase()} ${task.completed ? 'completed' : ''} ${task._spawned ? 'spawned' : ''}`;
            card.dataset.id = task.id;
            card.draggable  = true;
            if (task._spawned) { delete task._spawned; }

            card.innerHTML = `
                <div class="task-row">
                    <span class="drag-handle" title="Drag to reorder">⠿</span>
                    <input type="checkbox" class="task-cb" ${task.completed ? 'checked' : ''}
                        onchange="app.toggleTask(${task.id})" onclick="event.stopPropagation()">
                    <div class="task-body">
                        <div class="task-title">${this.esc(task.title)}</div>
                        <div class="task-badges">
                            <span class="badge b-${task.priority.toLowerCase()}">${task.priority}</span>
                            <span class="badge b-cat">${task.category}</span>
                            ${task.recurring && task.recurring !== 'none' ? `<span class="badge b-recur">🔄 ${recurLabel[task.recurring]}</span>` : ''}
                            ${overdue ? `<span class="badge b-overdue">⏰ Overdue</span>` : ''}
                            ${(task.tags || []).map(tag => `<span class="tag-chip" style="font-size:0.7em;">${tag}</span>`).join('')}
                        </div>
                        <div class="task-meta">
                            ${dueStr ? `<span>📅 ${dueStr}</span>` : ''}
                            ${task.attachments && task.attachments.length ? `<span>📎 ${task.attachments.length} file(s)</span>` : ''}
                            <span>📁 ${task.category}</span>
                        </div>
                        ${subs.length ? `
                            <div class="sub-progress">
                                <div class="sub-progress-label">${subDone}/${subs.length} subtasks · ${subPct}%</div>
                                <div class="sub-track"><div class="sub-fill" style="width:${subPct}%"></div></div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="task-actions">
                        <button class="btn-icon" title="Edit task"
                            onclick="event.stopPropagation(); app.openEdit(${task.id})">✏️</button>
                        <button class="btn-icon" title="Subtasks"
                            onclick="event.stopPropagation(); app.togglePanel(${task.id}, this)"
                            id="spbtn-${task.id}">☑</button>
                        <button class="btn-icon del" title="Delete"
                            onclick="event.stopPropagation(); app.deleteTask(${task.id})">🗑</button>
                    </div>
                </div>

                <div class="subtasks-panel" id="sp-${task.id}">
                    <div class="sub-input-row">
                        <input type="text" id="si-${task.id}" placeholder="Add subtask..."
                            onkeydown="if(event.key==='Enter'){app.addSubtask(${task.id});}">
                        <button class="sub-add-btn" onclick="app.addSubtask(${task.id})">+ Add</button>
                    </div>
                    ${subs.map(sub => `
                        <div class="sub-item">
                            <input type="checkbox" ${sub.done ? 'checked' : ''}
                                onchange="app.toggleSubtask(${task.id}, ${sub.id})">
                            <span class="sub-text ${sub.done ? 'done' : ''}">${this.esc(sub.text)}</span>
                            <button class="sub-del" onclick="app.deleteSubtask(${task.id}, ${sub.id})">✕</button>
                        </div>
                    `).join('')}
                </div>
            `;

            /* Drag and Drop */
            card.addEventListener('dragstart', e => {
                this.dragSrcId = task.id;
                requestAnimationFrame(() => card.classList.add('dragging'));
                e.dataTransfer.effectAllowed = 'move';
            });

            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
            });

            card.addEventListener('dragover', e => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                document.querySelectorAll('.task-card').forEach(c => c.classList.remove('drag-over'));
                card.classList.add('drag-over');
            });

            card.addEventListener('dragleave', () => {
                card.classList.remove('drag-over');
            });

            card.addEventListener('drop', e => {
                e.preventDefault();
                card.classList.remove('drag-over');
                if (this.dragSrcId == null || this.dragSrcId === task.id) return;
                const srcIdx = this.tasks.findIndex(t => t.id === this.dragSrcId);
                const dstIdx = this.tasks.findIndex(t => t.id === task.id);
                if (srcIdx === -1 || dstIdx === -1) return;
                const [moved] = this.tasks.splice(srcIdx, 1);
                this.tasks.splice(dstIdx, 0, moved);
                this.dragSrcId = null;
                this.saveAll();
                this.render();
            });

            list.appendChild(card);
        });

        this.updateStats();
        this.renderTagFilters();
        this.renderTagSugs();
    }

    /* ─── CLEAR ALL ─── */
    clearAll() {
        if (!confirm('Delete ALL tasks? This cannot be undone.')) return;
        this.tasks = [];
        this.saveAll();
        this.render();
    }

    /* ─── UTILS ─── */
    esc(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
    load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }
    saveAll() { this.save('tm_tasks', this.tasks); }
}

const app = new TaskApp();

// Close modal on overlay click
document.getElementById('editModal').addEventListener('click', e => {
    if (e.target.id === 'editModal') app.closeModal();
});
</script>
</body>
</html>
